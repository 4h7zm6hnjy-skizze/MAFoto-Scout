<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173c29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CampManager">
<title>CampManager – Platz 161</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f5f2ea;--card:#fff;--ink:#14221a;--muted:#6d776f;--line:#e4dfd4;
  --green:#173c29;--green2:#2f6a49;--soft:#edf3ef;--gold:#c98a34;--warn:#8a5a12;
  --danger:#a84032;--dangerbg:#fae8e4;--shadow:0 10px 30px rgba(26,42,31,.09);
  --radius:22px;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#faf8f3 0,#f3efe5 100%);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;height:76px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(250,248,243,.95);backdrop-filter:blur(18px);border-bottom:1px solid rgba(228,223,212,.85)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left;color:inherit;min-width:0}
.brand-logo{width:56px;height:48px;object-fit:cover;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);background:var(--green)}
.brand-fallback{width:56px;height:48px;border-radius:12px;background:var(--green);color:#fff;display:none;place-items:center;font-size:24px}
.brand span{display:flex;flex-direction:column;min-width:0}.brand strong{font-size:17px}.brand small{color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.top-actions{display:flex;align-items:center;gap:8px}
.status{font-size:11px;font-weight:800;padding:7px 9px;border-radius:999px;background:#efe9dc;color:#675c4a;white-space:nowrap}
.status.cloud{background:#e3f2e8;color:#24593a}.status.syncing{background:#fff0d2;color:#7b5720}.status.error{background:#f8ded8;color:#7e3228}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.app-shell{max-width:1100px;margin:0 auto;padding:18px 16px calc(98px + var(--safe))}
.view{display:none}.view.active{display:block}
.view-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}
.view-head h1{margin:0;font-size:27px}.view-head p{margin:4px 0 0;color:var(--muted)}
.hero{background:linear-gradient(135deg,#173c29 0%,#102319 72%);color:#fff;border-radius:28px;padding:20px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(180px,.5fr);gap:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-85px;top:-125px;background:radial-gradient(circle,#d79a42 0,rgba(215,154,66,.08) 66%,transparent 68%)}
.hero-copy{position:relative;z-index:1}.hero h1{font-size:30px;margin:5px 0}.hero p{margin:0;color:#dbe7df}.hero-logo{width:100%;max-height:155px;object-fit:cover;border-radius:18px;align-self:center;position:relative;z-index:1;border:1px solid rgba(255,255,255,.15)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}
.card{grid-column:span 4;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.full{grid-column:1/-1}.card.half{grid-column:span 6}
.card h2,.card h3{margin:0 0 8px}.card h2{font-size:18px}.card h3{font-size:15px}.card p{margin:4px 0;color:var(--muted)}
.metric{font-size:30px;font-weight:850;letter-spacing:-.035em}.metric small{font-size:13px;color:var(--muted);font-weight:650}
.card-action{border:1px solid var(--line);text-align:left;width:auto;color:inherit}.card-action:active{transform:scale(.995)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick{border:1px solid var(--line);background:#fff;padding:14px 12px;border-radius:16px;text-align:center;color:var(--ink)}.quick b{display:block;font-size:21px;margin-bottom:4px}.quick small{color:var(--muted)}
.section-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}.section-tabs::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:999px;font-weight:750;font-size:13px}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.row-main{flex:1;min-width:0}.row-title{font-weight:780;overflow-wrap:anywhere}.row-sub{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:6px;flex-shrink:0}.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px}.danger{color:var(--danger)}.done .row-title{text-decoration:line-through;color:var(--muted)}
.btn{border:0;background:var(--green);color:#fff;font-weight:800;padding:11px 15px;border-radius:13px}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger);color:#fff}.btn.block{width:100%}.btn:disabled{opacity:.55;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.empty{padding:28px 16px;border:1px dashed #ccc4b7;border-radius:18px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{border:1px solid #dcd5c8;background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none;width:100%}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7aa08a;box-shadow:0 0 0 3px rgba(65,113,82,.12)}
.modal{border:0;background:transparent;padding:0;width:min(650px,calc(100vw - 20px));max-height:92vh}.modal::backdrop{background:rgba(9,20,14,.55);backdrop-filter:blur(4px)}.modal-card{background:#faf8f3;border-radius:24px;border:1px solid var(--line);padding:16px;box-shadow:0 30px 90px rgba(0,0,0,.28);max-height:92vh;overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modal-head h2{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:0;right:0;padding:7px 10px calc(7px + var(--safe));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:#6f776f;border-radius:14px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav-btn span{font-size:20px;line-height:1}.nav-btn small{font-size:11px;font-weight:800}.nav-btn.active{color:var(--green);background:#edf3ef}
.toast{position:fixed;z-index:120;left:50%;bottom:90px;max-width:calc(100vw - 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#102219;color:#fff;padding:11px 15px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);transition:.2s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:#eef2ee;color:#31543e;padding:4px 8px;font-size:12px;font-weight:800}.badge.hero-badge{background:rgba(255,255,255,.12);color:#fff}.badge.warn{background:#fff0d2;color:#7b5720}.badge.bad{background:#f8ded8;color:#7e3228}
.cost-bars{display:flex;flex-direction:column;gap:9px}.cost-line{display:grid;grid-template-columns:130px 1fr 90px;gap:9px;align-items:center;font-size:13px}.bar{height:9px;background:#eee8dc;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold))}.right{text-align:right}
.notice{background:#f7f3e9;border:1px solid #e5dcc6;border-radius:16px;padding:12px;margin:12px 0}.notice.good{background:#e9f4ed;border-color:#cfe3d6}.notice.bad{background:var(--dangerbg);border-color:#ecc8c1}.small-note{font-size:12px;color:var(--muted);line-height:1.45}.codebox{background:#132019;color:#e7efe9;padding:12px;border-radius:14px;white-space:pre-wrap;overflow:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;max-height:260px}.divider{height:1px;background:var(--line);margin:16px 0}.kpi{display:flex;align-items:center;justify-content:space-between;gap:12px}.kpi strong{font-size:18px}.overdue{border-color:#ecc8c1;background:#fff9f7}
@media(max-width:760px){
  .hero{grid-template-columns:1fr}.hero-logo{max-height:180px}.card,.card.half{grid-column:1/-1}
  .quick-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
  .cost-line{grid-template-columns:105px 1fr 78px}.view-head h1{font-size:24px}.brand small{max-width:160px}
}
@media(min-width:900px){.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:620px;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}.app-shell{padding-bottom:110px}.hero{padding:24px}}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="brandBtn" aria-label="Startseite">
    <img id="brandLogo" class="brand-logo" src="logo.jpg" alt="CampManager Logo">
    <span id="brandFallback" class="brand-fallback">⛺</span>
    <span><strong>Platz 161</strong><small id="campNameTop">Campingverwaltung</small></span>
  </button>
  <div class="top-actions">
    <span id="syncBadge" class="status">Lokal</span>
    <button id="accountBtn" class="icon-btn" aria-label="Konto und Einstellungen">⚙</button>
  </div>
</header>

<main class="app-shell" id="app">
  <section id="view-dashboard" class="view active"></section>
  <section id="view-shopping" class="view"></section>
  <section id="view-costs" class="view"></section>
  <section id="view-care" class="view"></section>
  <section id="view-more" class="view"></section>
</main>

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <button class="nav-btn active" data-view="dashboard"><span>⌂</span><small>Start</small></button>
  <button class="nav-btn" data-view="shopping"><span>✓</span><small>Einkäufe</small></button>
  <button class="nav-btn" data-view="costs"><span>€</span><small>Kosten</small></button>
  <button class="nav-btn" data-view="care"><span>♧</span><small>Pflege</small></button>
  <button class="nav-btn" data-view="more"><span>•••</span><small>Mehr</small></button>
</nav>

<dialog id="modal" class="modal">
  <form method="dialog" class="modal-card" id="modalCard">
    <div class="modal-head">
      <h2 id="modalTitle">Eintrag</h2>
      <button value="cancel" class="icon-btn" aria-label="Schließen">×</button>
    </div>
    <div id="modalBody"></div>
    <div id="modalActions" class="modal-actions"></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
'use strict';

const STORAGE_KEY='campmanager_full_v1';
const CLOUD_CFG_KEY='campmanager_cloud_cfg_v1';
const CLOUD_SESSION_KEY='campmanager_cloud_session_v1';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const id=()=>globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const yearNow=()=>new Date().getFullYear();
const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('de-DE'):'–';
const money=v=>Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=(v,d=0)=>Number(v||0).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:d});
const days=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)):0;
const parseDate=v=>v?new Date(v+'T12:00:00'):null;

function defaults(){
  return {
    version:1,
    updatedAt:new Date().toISOString(),
    site:{campName:'Campingplatz',pitch:'161',area:'',notes:''},
    family:[
      {id:id(),name:'Marcel'},
      {id:id(),name:'Denise'},
      {id:id(),name:'Leon'},
      {id:id(),name:'Luca'}
    ],
    nextArrival:'',
    shopping:[],
    costs:[],
    petroleum:[],
    electricity:[],
    stays:[],
    lawn:[],
    hedge:[],
    contracts:[],
    gasChecks:[]
  };
}
function normalize(x){
  const d=defaults();
  if(!x||typeof x!=='object')return d;
  const o={...d,...x};
  o.site={...d.site,...(x.site||{})};
  ['family','shopping','costs','petroleum','electricity','stays','lawn','hedge','contracts','gasChecks'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=d[k]});
  return o;
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw)return normalize(JSON.parse(raw));
    const old=localStorage.getItem('campmanager_onefile_v1')||localStorage.getItem('platz161_state_v4')||localStorage.getItem('platz161_state_v2');
    return old?normalize(JSON.parse(old)):defaults();
  }catch(e){console.warn(e);return defaults()}
}
let state=loadLocal();
let activeView='dashboard';
const activeTab={costs:'overview',care:'lawn',more:'stays'};
let pushTimer=null;
let cloudCfg=loadCloudCfg();
let cloudSession=loadCloudSession();
let lastCloudUpdated='';

function saveLocal(){
  state.updatedAt=new Date().toISOString();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function save(){
  saveLocal();
  renderAll();
  scheduleCloudPush();
}
function toast(t){
  const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)
}
function setSync(kind,text){
  const b=$('#syncBadge');b.className='status'+(kind?' '+kind:'');b.textContent=text;
}
function empty(t){return '<div class="empty">'+esc(t)+'</div>'}
function badge(t,cls=''){return '<span class="badge '+cls+'">'+esc(t)+'</span>'}
function totalNights(year=null){
  return state.stays.reduce((s,x)=>{
    if(!x.arrival||!x.departure)return s;
    if(year&&Number(x.arrival.slice(0,4))!==Number(year))return s;
    return s+days(x.arrival,x.departure);
  },0)
}
function petroleumStock(){return state.petroleum.reduce((s,x)=>s+(x.kind==='purchase'?Number(x.liters||0):-Number(x.liters||0)),0)}
function costData(y=yearNow()){
  const d={annual:0,repairs:0,purchases:0,other:0,electricity:0,petroleum:0};
  state.costs.filter(x=>Number(x.year)===Number(y)).forEach(x=>d[x.category]=(d[x.category]||0)+Number(x.amount||0));
  state.electricity.filter(x=>Number(x.year)===Number(y)).forEach(x=>d.electricity+=Number(x.cost||0)+Number(x.meterRent||0));
  state.petroleum.filter(x=>x.kind==='purchase'&&(x.date||'').startsWith(String(y))).forEach(x=>d.petroleum+=Number(x.price||0));
  return d
}
function arrivalText(){
  if(!state.nextArrival)return'Noch nicht geplant';
  const d=Math.round((parseDate(state.nextArrival)-parseDate(today()))/86400000);
  if(d===0)return'Heute';if(d===1)return'Morgen';if(d>1)return'in '+d+' Tagen';return fmtDate(state.nextArrival)
}
function nextDeadline(){
  const candidates=[];
  state.contracts.forEach(x=>{
    if(x.noticeDate)candidates.push({date:x.noticeDate,title:'Vertragsfrist',detail:x.name});
    else if(x.endDate)candidates.push({date:x.endDate,title:'Vertragsende',detail:x.name});
  });
  state.gasChecks.forEach(x=>{if(x.nextDue)candidates.push({date:x.nextDue,title:'Gasprüfung',detail:x.company||'Nächste Prüfung'})});
  candidates.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return candidates.find(x=>x.date>=today())||null
}
function deadlineStatus(date){
  if(!date)return'';
  const d=Math.ceil((parseDate(date)-parseDate(today()))/86400000);
  if(d<0)return'Überfällig';
  if(d===0)return'Heute';
  if(d===1)return'Morgen';
  if(d<=30)return'in '+d+' Tagen';
  return fmtDate(date)
}
function tabs(section,items){return '<div class="section-tabs">'+items.map(([k,l])=>'<button class="chip '+(activeTab[section]===k?'active':'')+'" data-section="'+section+'" data-tab="'+k+'">'+esc(l)+'</button>').join('')+'</div>'}

function renderTop(){
  $('#campNameTop').textContent=(state.site.campName||'Campingplatz')+' · Platz '+(state.site.pitch||'161');
  if(cloudReady()&&cloudSession&&cloudSession.access_token)setSync('cloud','Cloud');else setSync('','Lokal')
}
function renderDashboard(){
  const y=yearNow(),c=costData(y),total=Object.values(c).reduce((a,b)=>a+b,0),next=nextDeadline();
  $('#view-dashboard').innerHTML=`
  <div class="hero">
    <div class="hero-copy"><div class="badge hero-badge">Familien-CampManager</div><h1>Die Hentschel's</h1><p>${esc(state.site.campName||'Campingplatz')} · Platz ${esc(state.site.pitch||'161')}</p></div>
    <img class="hero-logo" src="logo.jpg" alt="CampManager Logo" onerror="this.style.display='none'">
  </div>
  <div class="grid">
    <button class="card card-action" data-open="arrival"><h3>Nächste Anreise</h3><div class="metric">${state.nextArrival?fmtDate(state.nextArrival):'–'}</div><p>${esc(arrivalText())}</p></button>
    <button class="card card-action" data-go="shopping"><h3>Offene Einkäufe</h3><div class="metric">${state.shopping.filter(x=>!x.done).length}</div><p>noch zu besorgen</p></button>
    <button class="card card-action" data-go="more" data-tab="stays"><h3>Übernachtungen ${y}</h3><div class="metric">${totalNights(y)}</div><p>Gesamt: ${totalNights()} Nächte</p></button>
    <button class="card card-action" data-go="costs" data-tab="petroleum"><h3>Petroleum</h3><div class="metric">${num(petroleumStock(),1)} <small>Liter</small></div><p>aktueller Bestand</p></button>
    <button class="card card-action" data-go="costs" data-tab="overview"><h3>Kosten ${y}</h3><div class="metric">${money(total)}</div><p>Jahresübersicht</p></button>
    <button class="card card-action ${next&&next.date<today()?'overdue':''}" data-go="more" data-tab="${next&&next.title==='Gasprüfung'?'gas':'contracts'}"><h3>Nächste Frist</h3><div class="metric" style="font-size:21px">${next?fmtDate(next.date):'–'}</div><p>${next?esc(next.title+' · '+deadlineStatus(next.date)):'Keine Frist eingetragen'}</p></button>
    <div class="card full"><h2>Schnellzugriff</h2><div class="quick-grid">
      <button class="quick" data-add="shopping"><b>＋</b><small>Einkauf</small></button>
      <button class="quick" data-add="petroleum"><b>⛽</b><small>Petroleum</small></button>
      <button class="quick" data-add="stay"><b>☾</b><small>Übernachtung</small></button>
      <button class="quick" data-add="gas"><b>✓</b><small>Gasprüfung</small></button>
    </div></div>
    ${renderUpcoming()}
  </div>`
}
function renderUpcoming(){
  const rows=[];
  state.contracts.forEach(x=>{
    const d=x.noticeDate||x.endDate;if(d)rows.push({date:d,title:x.name,kind:x.noticeDate?'Vertragsfrist':'Vertragsende'})
  });
  state.gasChecks.forEach(x=>{if(x.nextDue)rows.push({date:x.nextDue,title:x.company||'Gasprüfung',kind:'Gasprüfung'})});
  rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const upcoming=rows.filter(x=>x.date>=today()).slice(0,5);
  return `<div class="card full"><h2>Nächste Termine</h2>${upcoming.length?'<div class="list">'+upcoming.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${esc(x.kind)}</div><div class="row-sub">${esc(x.title)}</div></div><div><strong>${fmtDate(x.date)}</strong><div class="row-sub">${esc(deadlineStatus(x.date))}</div></div></div>`).join('')+'</div>':empty('Noch keine Vertrags- oder Prüftermine eingetragen.')}</div>`
}

function renderShopping(){
  const rows=[...state.shopping].sort((a,b)=>Number(a.done)-Number(b.done)||String(a.name).localeCompare(String(b.name),'de'));
  $('#view-shopping').innerHTML=`<div class="view-head"><div><h1>Offene Einkäufe</h1><p>Was für den Campingplatz noch benötigt wird.</p></div></div>
  <div class="toolbar"><button class="btn" data-add="shopping">＋ Einkauf hinzufügen</button></div>

function saveEditor(type,existingId){
  const f=$('#editForm');if(!f.reportValidity())return;
  const item={...Object.fromEntries(new FormData(f).entries()),id:existingId||id()};
  const key=mapType(type),arr=state[key],old=existingId?arr.find(x=>x.id===existingId):null;
  if(type==='shopping')item.done=old?!!old.done:false;
  if(type==='stay'&&item.departure<item.arrival){toast('Abreise darf nicht vor der Anreise liegen');return}
  if(type==='electricity'&&!existingId&&state.electricity.some(x=>String(x.year)===String(item.year))){toast('Für dieses Jahr existiert bereits ein Stromwert');return}
  if(type==='hedge'&&!existingId){

    if(y&&state.hedge.filter(x=>(x.date||'').startsWith(y)).length>=2){toast('Für '+y+' sind bereits 2 Heckenschnitte eingetragen');return}
  }
  if(old)Object.assign(old,item);else arr.push(item);
  $('#modal').close();save();toast('Gespeichert')
}

/* Cloud: Supabase REST, ohne externe JavaScript-Bibliothek */
function loadCloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||'{}')}catch{return{}}}
function saveCloudCfg(c){cloudCfg=c;localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(c))}
function loadCloudSession(){try{return JSON.parse(localStorage.getItem(CLOUD_SESSION_KEY)||'null')}catch{return null}}
function saveCloudSession(s){cloudSession=s;if(s)localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(CLOUD_SESSION_KEY)}
function cloudReady(){return !!(cloudCfg&&cloudCfg.url&&cloudCfg.anonKey)}
function cloudBase(){return String(cloudCfg.url||'').replace(/\/+$/,'')}
async function api(path,{method='GET',body=null,token=null,prefer=null}={}){
  if(!cloudReady())throw new Error('Cloud nicht eingerichtet');
  const headers={'apikey':cloudCfg.anonKey,'Authorization':'Bearer '+(token||cloudCfg.anonKey)};
  if(body!==null)headers['Content-Type']='application/json';
  if(prefer)headers['Prefer']=prefer;
  const res=await fetch(cloudBase()+path,{method,headers,body:body!==null?JSON.stringify(body):undefined});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
  if(!res.ok)throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||('HTTP '+res.status));
  return data
}
async function refreshSession(){
  if(!cloudSession||!cloudSession.refresh_token)return false;
  try{
    const s=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:cloudSession.refresh_token}});
    saveCloudSession(s);return true
  }catch(e){console.warn(e);saveCloudSession(null);return false}
}
async function ensureSession(){
  if(!cloudSession||!cloudSession.access_token)return false;
  if(cloudSession.expires_at&&Date.now()/1000>Number(cloudSession.expires_at)-60)return await refreshSession();
  return true
}
async function signIn(email,password){
  const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});
  saveCloudSession(s);return s
}
async function signUp(email,password){
  const s=await api('/auth/v1/signup',{method:'POST',body:{email,password}});
  if(s&&s.access_token)saveCloudSession(s);return s
}
async function signOut(){
  try{if(cloudSession&&cloudSession.access_token)await api('/auth/v1/logout',{method:'POST',token:cloudSession.access_token})}catch{}
  saveCloudSession(null);lastCloudUpdated='';renderAll()
}
async function pullCloud({silent=false}={}){
  if(!cloudReady()||!await ensureSession())return false;
  if(!silent)setSync('syncing','Lädt…');
  try{
    const uid=cloudSession.user&&cloudSession.user.id;if(!uid)throw new Error('Benutzer-ID fehlt');
    const rows=await api('/rest/v1/camp_states?select=user_id,data,updated_at&user_id=eq.'+encodeURIComponent(uid)+'&limit=1',{token:cloudSession.access_token});
    if(rows&&rows[0]){
      const remote=rows[0];
      if(!lastCloudUpdated||String(remote.updated_at)>String(lastCloudUpdated)){
        state=normalize(remote.data);saveLocal();lastCloudUpdated=remote.updated_at;renderAll()
      }
    }else await pushCloud({silent:true});
    setSync('cloud','Cloud');return true
  }catch(e){console.error(e);setSync('error','Cloud-Fehler');if(!silent)toast('Cloud laden fehlgeschlagen: '+e.message);return false}
}
async function pushCloud({silent=false}={}){
  if(!cloudReady()||!await ensureSession())return false;
  if(!silent)setSync('syncing','Speichert…');
  try{
    const uid=cloudSession.user&&cloudSession.user.id;if(!uid)throw new Error('Benutzer-ID fehlt');
    const updated=new Date().toISOString();
    const data=await api('/rest/v1/camp_states?on_conflict=user_id',{method:'POST',token:cloudSession.access_token,prefer:'resolution=merge-duplicates,return=representation',body:{user_id:uid,data:state,updated_at:updated}});
    lastCloudUpdated=(data&&data[0]&&data[0].updated_at)||updated;setSync('cloud','Cloud');return true
  }catch(e){console.error(e);setSync('error','Cloud-Fehler');if(!silent)toast('Cloud speichern fehlgeschlagen: '+e.message);return false}
}
function scheduleCloudPush(){
  if(!cloudReady()||!cloudSession)return;
  clearTimeout(pushTimer);pushTimer=setTimeout(()=>pushCloud({silent:true}),650)
}
function cloudSql(){
return `create table if not exists public.camp_states (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);

alter table public.camp_states enable row level security;

drop policy if exists "camp_select_own" on public.camp_states;
create policy "camp_select_own" on public.camp_states
for select using (auth.uid() = user_id);

drop policy if exists "camp_insert_own" on public.camp_states;
create policy "camp_insert_own" on public.camp_states
for insert with check (auth.uid() = user_id);

drop policy if exists "camp_update_own" on public.camp_states;
create policy "camp_update_own" on public.camp_states
for update using (auth.uid() = user_id) with check (auth.uid() = user_id);

drop policy if exists "camp_delete_own" on public.camp_states;
create policy "camp_delete_own" on public.camp_states
for delete using (auth.uid() = user_id);`;
}
function cloudPanel(){
  const signed=!!(cloudSession&&cloudSession.access_token);
  return `
  <div class="notice ${signed?'good':''}"><strong>${signed?'Familien-Sync aktiv':'Optionaler Familien-Sync'}</strong><br>${signed?'Angemeldet als '+esc((cloudSession.user&&cloudSession.user.email)||'Familienkonto'):'Lokal funktioniert die App sofort. Für gemeinsame Daten auf mehreren Geräten kannst du einen Supabase-Zugang eintragen.'}</div>
  <form id="cloudConfigForm"><div class="form-grid">
    ${field('Supabase Project URL','url',cloudCfg.url||'','url','placeholder="https://xxxxx.supabase.co"')}
    ${field('Supabase Anon/Public Key','anonKey',cloudCfg.anonKey||'','text','autocomplete="off"')}
  </div></form>
  <div class="toolbar"><button type="button" class="btn secondary" id="saveCloudConfig">Cloud-Daten speichern</button><button type="button" class="btn secondary" id="showSql">SQL anzeigen</button></div>
  ${cloudReady()?`<div class="divider"></div>
  ${signed?`<div class="toolbar"><button type="button" class="btn" id="pullNow">Cloud laden</button><button type="button" class="btn" id="pushNow">Cloud speichern</button><button type="button" class="btn secondary" id="logoutCloud">Abmelden</button></div>`:
  `<form id="authForm"><div class="form-grid">${field('Familien-E-Mail','email','','email','required autocomplete="email"')}${field('Passwort','password','','password','required minlength="6" autocomplete="current-password"')}</div></form><div class="toolbar"><button type="button" class="btn" id="loginCloud">Anmelden</button><button type="button" class="btn secondary" id="registerCloud">Familienkonto erstellen</button></div>`}
  <p class="small-note">Auf allen Geräten dieselbe Familien-E-Mail und dasselbe Passwort verwenden. Die App synchronisiert beim Speichern sowie beim Öffnen/Zurückkehren zur App.</p>`:''}`
}
function openAccount(){
  modal('Einstellungen & Daten',`
  <h3>Stellplatz & App</h3>
  <div class="toolbar"><button type="button" class="btn secondary" id="editSiteBtn">Stellplatz bearbeiten</button></div>
  <p class="small-note">Auf dem iPhone kannst du die Web-App über Teilen → „Zum Home-Bildschirm“ hinzufügen.</p>
  <div class="divider"></div>
  <h3>Familien-Synchronisierung</h3>${cloudPanel()}
  <div class="divider"></div>
  <h3>Datensicherung</h3>
  <div class="toolbar"><button type="button" class="btn secondary" id="exportBtn">Backup exportieren</button><label class="btn secondary">Backup importieren<input id="importFile" type="file" accept="application/json" hidden></label><button type="button" class="btn danger" id="resetBtn">Lokale Daten löschen</button></div>
  `,'<button value="cancel" class="btn secondary">Schließen</button>');
  bindAccountButtons()
}
function bindAccountButtons(){
  $('#editSiteBtn').onclick=()=>{closeModal();openSite()};
  $('#saveCloudConfig').onclick=()=>{const d=Object.fromEntries(new FormData($('#cloudConfigForm')).entries());saveCloudCfg({url:String(d.url||'').trim().replace(/\/+$/,''),anonKey:String(d.anonKey||'').trim()});toast('Cloud-Daten gespeichert');openAccount()};
  $('#showSql').onclick=()=>{modal('Supabase SQL',`<p class="small-note">Diesen SQL-Code einmal im Supabase SQL Editor ausführen:</p><pre class="codebox">${esc(cloudSql())}</pre><div class="toolbar"><button type="button" class="btn secondary" id="copySql">SQL kopieren</button></div>`,'<button value="cancel" class="btn secondary">Schließen</button>');$('#copySql').onclick=async()=>{try{await navigator.clipboard.writeText(cloudSql());toast('SQL kopiert')}catch{toast('Kopieren nicht möglich')}}};
  if($('#loginCloud'))$('#loginCloud').onclick=async()=>{const f=$('#authForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f).entries());setSync('syncing','Anmeldung…');try{await signIn(d.email,d.password);await pullCloud({silent:true});toast('Cloud verbunden');closeModal();renderAll()}catch(e){setSync('error','Fehler');toast('Anmeldung fehlgeschlagen: '+e.message)}};
  if($('#registerCloud'))$('#registerCloud').onclick=async()=>{const f=$('#authForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f).entries());try{const s=await signUp(d.email,d.password);if(s&&s.access_token){await pushCloud({silent:true});toast('Familienkonto erstellt');closeModal();renderAll()}else toast('Konto erstellt. Bitte E-Mail bestätigen und danach anmelden.')}catch(e){toast('Konto konnte nicht erstellt werden: '+e.message)}};
  if($('#pullNow'))$('#pullNow').onclick=async()=>{await pullCloud();toast('Cloud-Daten geladen')};
  if($('#pushNow'))$('#pushNow').onclick=async()=>{await pushCloud();toast('Cloud-Daten gespeichert')};
  if($('#logoutCloud'))$('#logoutCloud').onclick=async()=>{await signOut();toast('Cloud abgemeldet');closeModal()};
  $('#exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='campmanager-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)};
  $('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=normalize(JSON.parse(await f.text()));save();closeModal();toast('Backup importiert')}catch{toast('Ungültige Backup-Datei')}};
  $('#resetBtn').onclick=()=>{if(confirm('Wirklich alle lokalen CampManager-Daten löschen?')){state=defaults();saveLocal();renderAll();closeModal();toast('Lokale Daten gelöscht')}}
}
function closeModal(){if($('#modal').open)$('#modal').close()}

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){const v=go.dataset.go;if(go.dataset.tab)activeTab[v]=go.dataset.tab;renderAll();showView(v);return}
  const nav=e.target.closest('[data-view]');if(nav){showView(nav.dataset.view);return}
  const tab=e.target.closest('[data-section][data-tab]');if(tab){activeTab[tab.dataset.section]=tab.dataset.tab;renderAll();showView(tab.dataset.section);return}
  const add=e.target.closest('[data-add]');if(add){openEditor(add.dataset.add);return}
  const edit=e.target.closest('[data-edit]');if(edit){editItem(edit.dataset.edit,edit.dataset.id);return}
  const del=e.target.closest('[data-del]');if(del){removeItem(del.dataset.del,del.dataset.id);return}
  const open=e.target.closest('[data-open]');if(open){open.dataset.open==='site'?openSite():openArrival();return}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-toggle-shopping]')){const x=state.shopping.find(r=>r.id===e.target.dataset.toggleShopping);if(x){x.done=e.target.checked;save()}}
});
$('#brandBtn').onclick=()=>showView('dashboard');
$('#accountBtn').onclick=openAccount;
$('#brandLogo').onerror=()=>{$('#brandLogo').style.display='none';$('#brandFallback').style.display='grid'};

window.addEventListener('focus',()=>{if(cloudReady()&&cloudSession)pullCloud({silent:true})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudReady()&&cloudSession)pullCloud({silent:true})});
setInterval(()=>{if(document.visibilityState==='visible'&&cloudReady()&&cloudSession)pullCloud({silent:true})},30000);

async function boot(){
  try{
    renderAll();
    if(cloudReady()&&cloudSession){setSync('syncing','Cloud…');await pullCloud({silent:true});renderAll()}
  }catch(err){
    console.error(err);
    $('#app').innerHTML='<div class="card full"><h2>CampManager konnte nicht starten</h2><p>'+esc(err.message||String(err))+'</p></div>'
  }
}
boot();
})();
</script>
